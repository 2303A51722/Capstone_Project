{% extends "base.html" %}{% block title %}Contact{% endblock %}{% block content %}
<section class="page-hero"><div class="eyebrow">CONTACT</div><h1>We’re here to help.</h1><p>Send a message about CuraX.</p></section>
<section class="section form-section"><form class="form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required maxlength="100"></label><label>Email address<input type="email" name="email" required maxlength="180"></label><label>Message<textarea name="message" rows="5" required maxlength="3000"></textarea></label><button class="btn btn-primary" type="submit">Send message <i class="fa-solid fa-paper-plane"></i></button><p class="hint">Submissions are acknowledged locally; email delivery is not configured.</p></form></section>
{% endblock %}
