{% extends "base.html" %}{% block title %}Password help{% endblock %}{% block content %}<section class="section narrow"><form class="form-card" method="post"><div class="eyebrow">ACCOUNT HELP</div><h2>Forgot your password?</h2><p class="muted">Enter your registered email. Email-based password reset is not configured in this local prototype.</p><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required></label><button class="btn btn-primary" type="submit">Continue</button><a class="text-link" href="{{ url_for('login') }}">Back to login</a></form></section>{% endblock %}
